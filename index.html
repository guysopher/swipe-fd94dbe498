<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>איזה תמונות אתם הכי אוהבים?</title>
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #5b21b6;
    --bg: #f5f3fa;
    --text: #1e1b2e;
    --muted: #6b6580;
    --like: #22c55e;
    --pass: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- Name gate ---------- */
  #nameGate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: linear-gradient(160deg, var(--purple), var(--purple-dark));
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  #nameGate h1 { font-size: 26px; margin: 0 0 4px; }
  #nameGate p { margin: 0; opacity: .85; font-size: 15px; max-width: 320px; }
  #nameInput {
    width: min(280px, 80vw);
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    text-align: center;
  }
  #startBtn {
    padding: 14px 32px;
    border-radius: 12px;
    border: none;
    background: #fff;
    color: var(--purple-dark);
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  #startBtn:disabled { opacity: .5; }

  /* ---------- App ---------- */
  #app { display: none; position: relative; height: 100%; }
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    background: transparent;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header .voter { font-weight: 700; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .header .progress { font-size: 13px; opacity: .85; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  .deck-area {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    position: absolute;
    inset: 0;
    background: #000;
    border-radius: 0;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
    will-change: transform;
  }
  .card img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .badge {
    position: absolute;
    top: 28px;
    padding: 8px 18px;
    border: 3px solid;
    border-radius: 10px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .04em;
    opacity: 0;
    text-transform: uppercase;
  }
  .badge.like { right: 20px; color: var(--like); border-color: var(--like); transform: rotate(-12deg); }
  .badge.pass { left: 20px; color: var(--pass); border-color: var(--pass); transform: rotate(12deg); }

  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 18px 0 max(18px, env(safe-area-inset-bottom));
  }
  .controls button {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(30,20,50,.18);
  }
  #passBtn, #likeBtn {
    width: 64px; height: 64px;
    font-size: 26px;
    background: #fff;
  }
  #passBtn { color: var(--pass); }
  #likeBtn { color: var(--like); }
  #undoBtn {
    width: 46px; height: 46px;
    font-size: 18px;
    background: #fff;
    color: var(--muted);
  }
  .controls button:active { transform: scale(.92); }
  .controls button:disabled { opacity: .35; }

  /* ---------- Done screen ---------- */
  #doneScreen {
    display: none;
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--purple), var(--purple-dark));
    color: #fff;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }
  #doneScreen h1 { font-size: 26px; margin: 0; }
  #doneScreen p { margin: 0; opacity: .9; }
  #doneScreen .stats { font-size: 15px; opacity: .85; }
</style>
</head>
<body>

<div id="nameGate">
  <h1>איזה תמונות אתם הכי אוהבים?</h1>
  <p>גלגלו את כל התמונות מהטיול — ימינה אם אהבתם, שמאלה אם לא. בסוף נבנה אלבום מכל התמונות שלפחות אחד מכם אהב.</p>
  <input id="nameInput" placeholder="מה השם שלך?" maxlength="30" autocomplete="off">
  <button id="startBtn" disabled>בואו נתחיל</button>
</div>

<div id="app">
  <div class="header">
    <span class="voter" id="voterLabel"></span>
    <span class="progress" id="progressLabel"></span>
  </div>
  <div class="deck-area" id="deckArea">
    <div class="card" id="card">
      <img id="cardImg" alt="">
      <div class="badge like" id="likeBadge">אהבתי</div>
      <div class="badge pass" id="passBadge">דלג</div>
    </div>
  </div>
  <div class="controls">
    <button id="passBtn" title="דלג">✕</button>
    <button id="undoBtn" title="בטל">↺</button>
    <button id="likeBtn" title="אהבתי">❤</button>
  </div>
</div>

<div id="doneScreen">
  <h1>סיימתם! 🎉</h1>
  <p id="doneStats" class="stats"></p>
  <p>תודה! אפשר לסגור את הדף עכשיו.</p>
</div>

nameInput.addEventListener('input', () => {

});

  if (e.key === 'Enter' && !startBtn.disabled) startBtn.click();
});

startBtn.addEventListener('click', () => {
  voter = nameInput.value.trim();
  loadProgress();
  nameGate.style.display = 'none';
  app.style.display = 'flex';
  voterLabel.textContent = voter;
  renderCard();
});

function storageKey(suffix) {
  return `swipe_${voter}_${suffix}`;
}

function loadProgress() {
  try {
    votes = JSON.parse(localStorage.getItem(storageKey('votes')) || '{}');
    position = parseInt(localStorage.getItem(storageKey('position')) || '0', 10);
  } catch (e) {
    votes = {};
    position = 0;
  }
  if (position > DECK.length) position = DECK.length;
}

function saveProgress() {
  localStorage.setItem(storageKey('votes'), JSON.stringify(votes));
  localStorage.setItem(storageKey('position'), String(position));
}

function sendVote(idx, choice) {
  fetch('/api/vote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ voter, idx, choice }),
  }).catch(() => {});
}

function renderCard() {
  if (position >= DECK.length) {
    showDone();
    return;
  }
  const item = DECK[position];
  card.style.transition = 'none';
  card.style.transform = 'translateX(0) rotate(0)';
  card.style.opacity = '1';
  likeBadge.style.opacity = '0';
  passBadge.style.opacity = '0';
  cardImg.src = IMAGE_BASE + item.idx + '.jpg';
  progressLabel.textContent = `${position + 1} / ${DECK.length}`;
  undoBtn.disabled = history.length === 0;
}

function showDone() {
  app.style.display = 'none';
  doneScreen.style.display = 'flex';
  const likes = Object.values(votes).filter(v => v === 'like').length;
  const passes = Object.values(votes).filter(v => v === 'pass').length;
  document.getElementById('doneStats').textContent = `${likes} אהבתם, ${passes} דילגתם, מתוך ${DECK.length} תמונות.`;
}

function commitVote(choice) {
  const item = DECK[position];
  votes[item.idx] = choice;
  history.push(item.idx);
  sendVote(item.idx, choice);
  position++;
  saveProgress();
}

function animateAway(direction, choice) {
  const distance = window.innerWidth * 1.2;
  card.style.transition = 'transform .32s ease, opacity .32s ease';
  card.style.transform = `translateX(${direction * distance}px) rotate(${direction * 18}deg)`;
  card.style.opacity = '0';
  commitVote(choice);
  setTimeout(renderCard, 320);
}

passBtn.addEventListener('click', () => animateAway(-1, 'pass'));
likeBtn.addEventListener('click', () => animateAway(1, 'like'));

undoBtn.addEventListener('click', () => {
  if (!history.length) return;
  const lastIdx = history.pop();
  delete votes[lastIdx];
  position--;
  saveProgress();
  renderCard();
});

document.addEventListener('keydown', (e) => {
  if (app.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') animateAway(1, 'like');
  else if (e.key === 'ArrowLeft') animateAway(-1, 'pass');
  else if (e.key === 'Backspace') undoBtn.click();
});

// ---------- Drag (pointer events cover mouse + touch) ----------
let dragging = false;
let startX = 0;
let dx = 0;
const SWIPE_THRESHOLD = 110;

card.addEventListener('pointerdown', (e) => {
  dragging = true;
  startX = e.clientX;
  card.setPointerCapture(e.pointerId);
  card.style.transition = 'none';
  card.style.cursor = 'grabbing';
});

card.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dx = e.clientX - startX;
  const rotate = dx / 18;
  card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;
  const ratio = Math.min(Math.abs(dx) / SWIPE_THRESHOLD, 1);
  if (dx > 0) {
    likeBadge.style.opacity = String(ratio);
    passBadge.style.opacity = '0';
  } else {
    passBadge.style.opacity = String(ratio);
    likeBadge.style.opacity = '0';
  }
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  card.style.cursor = 'grab';
  if (Math.abs(dx) > SWIPE_THRESHOLD) {
    animateAway(dx > 0 ? 1 : -1, dx > 0 ? 'like' : 'pass');
  } else {
    card.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)';
    card.style.transform = 'translateX(0) rotate(0)';
    likeBadge.style.opacity = '0';
    passBadge.style.opacity = '0';
  }
  dx = 0;
}
card.addEventListener('pointerup', endDrag);
card.addEventListener('pointercancel', endDrag);
</script>
